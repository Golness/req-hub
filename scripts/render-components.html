<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';

// Mock fetch for API calls
const originalFetch = window.fetch;
window.fetch = async (url, options) => {
  const urlStr = typeof url === 'string' ? url : url.url;
  
  // Mock create-status
  if (urlStr.includes('/create-status')) {
    return {
      ok: true,
      json: async () => ({
        branch: 'feature/zhangsan/2026-03-20-报表导出',
        head: 'abc123def456',
        dirty: false,
        inProgress: false,
        canUpdateMain: false,
        existingRequirement: null,
      }),
    };
  }
  
  // Mock tree
  if (urlStr.includes('/tree')) {
    return {
      ok: true,
      json: async () => ({
        tree: {
          developers: [
            {
              name: 'zhangsan',
              requirementCount: 3,
              requirements: [
                { id: '2026-03-15-报价单导出', date: '2026-03-15', title: '报价单导出', path: 'zhangsan/2026-03-15-报价单导出', fileCount: 4 },
                { id: '2026-03-18-审批流程优化', date: '2026-03-18', title: '审批流程优化', path: 'zhangsan/2026-03-18-审批流程优化', fileCount: 2 },
                { id: '2026-03-20-报表导出', date: '2026-03-20', title: '报表导出', path: 'zhangsan/2026-03-20-报表导出', fileCount: 0 },
              ],
            },
            {
              name: 'lisi',
              requirementCount: 1,
              requirements: [
                { id: '2026-03-10-用户管理', date: '2026-03-10', title: '用户管理', path: 'lisi/2026-03-10-用户管理', fileCount: 3 },
              ],
            },
          ],
        },
      }),
    };
  }
  
  return originalFetch(url, options);
};

// Mock locale
window.__DSH_LOCALE__ = {
  t: (key, params) => {
    const dict = {
      'CreateDirForm.message005': '基于 Git 分支命名规范创建需求文档目录',
      'CreateDirForm.message006': '开发者',
      'CreateDirForm.message007': '日期',
      'CreateDirForm.message008': '需求简述',
      'CreateDirForm.message009': '新增报表导出功能',
      'CreateDirForm.message010': '同时新建 Git 分支',
      'CreateDirForm.message011': '当前分支: ',
      'CreateDirForm.message012': '将创建分支:',
      'CreateDirForm.message014': '将创建目录:',
      'CreateDirForm.message015': '创建中...',
      'CreateDirForm.message016': ' 创建',
      'common.cancel': '取消',
      'common.loading': '加载中...',
      'RequirementDirModal.message001': '选择需求目录',
      'RequirementDirModal.message002': '暂无需求目录',
      'WorkspaceModal.message002': '选择工作区',
      'WorkspaceModal.message003': '暂无工作区',
      'common.close': '关闭',
      'files.count': '{value0} 文件',
      'create.developerExample': 'zhangsan',
    };
    let text = dict[key] || key;
    if (params) {
      Object.entries(params).forEach(([k, v]) => {
        text = text.replace(`{${k}}`, v);
      });
    }
    return text;
  },
};

// Import components (will be bundled)
const { CreateDirForm } = await import('/src/client/components/CreateDirForm.js');
const { RequirementDirModal } = await import('/src/client/components/RequirementDirModal.js');
const { WorkspaceModal } = await import('/src/client/components/WorkspaceModal.js');

const root = createRoot(document.getElementById('root'));

// Scene 1: CreateDirForm
root.render(
  React.createElement('div', { style: { padding: '20px' } },
    React.createElement(CreateDirForm, {
      workspaceId: 'ws-1',
      docsDir: 'docs',
      onClose: () => console.log('close'),
      initialCreateBranch: false,
      refreshVersion: 0,
    })
  )
);
</script>
</body>
</html>
